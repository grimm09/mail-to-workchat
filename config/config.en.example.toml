# Fictional English example. Copy to config.toml before adding private settings.
# Language labels do not translate text; keep a non-empty reply_body_seed.
[app]
name = "Mail to Workchat"
data_dir = "../.runtime"
templates_dir = "../templates"
snippet_chars = 500
poll_interval_seconds = 300
outbox_max_attempts = 6
initial_sync = "baseline"
auto_propose_templates = true
default_reply_language = "en"

# Optional personal interaction layer. Keep disabled until application-bot
# credentials and exact chat/user allowlists have been configured locally.
[interaction]
enabled = false
event_ttl_seconds = 600
response_chars = 3500
template_confirmation_required = true

[[bots]]
id = "dingtalk-personal"
platform = "dingtalk"
app_id_env = "DINGTALK_APP_CLIENT_ID"
app_secret_env = "DINGTALK_APP_CLIENT_SECRET"
allowed_chat_ids = []
allowed_user_ids = []
admin_user_ids = []
enabled = false
require_mention = true

# Standard IMAP with a password or app-specific password.
[[accounts]]
id = "operations"
label = "Operations mailbox"
host = "imap.example.com"
port = 993
username = "alerts@example.com"
password_env = "MAILBOX_PASSWORD"
folder = "INBOX"
security = "ssl"
enabled = true
max_messages_per_run = 100
max_message_bytes = 1048576
timeout_seconds = 20

# Enable one or more outgoing targets. URLs and signing secrets stay in the environment.
[[notifiers]]
id = "dingtalk-main"
kind = "dingtalk"
webhook_env = "DINGTALK_WEBHOOK_URL"
secret_env = "DINGTALK_SIGNING_SECRET"
enabled = true

[[notifiers]]
id = "feishu-main"
kind = "feishu"
webhook_env = "FEISHU_WEBHOOK_URL"
secret_env = "FEISHU_SIGNING_SECRET"
enabled = false

[[notifiers]]
id = "internal-hook"
kind = "generic"
webhook_env = "GENERIC_WEBHOOK_URL"
allowed_hosts = ["hooks.example.com"]
enabled = false

# The first enabled rule that matches wins.
[[rules]]
id = "action-required"
name = "Action-required notice"
enabled = true
notifier_ids = ["dingtalk-main"]
notification_title = "New action-required email"
reply_enabled = true
reply_language = "en"
reply_subject_seed = "Re: {subject}"
reply_body_seed = """
Hello,

Thank you for your email.
We will review case {case_id} and determine the next steps.

Thank you.
"""

[rules.match]
sender_regex = "(?i)^alerts@example\\.com$|<alerts@example\\.com>"
subject_regex = "(?i)action required"
body_regex = "(?i)case[ -]?id"

[rules.fields.case_id]
source = "body"
pattern = "(?im)^case[ -]?id\\s*[:#]\\s*(?P<value>[A-Z0-9-]+)"
required = true
