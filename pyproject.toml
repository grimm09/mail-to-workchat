[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-to-workchat"
version = "0.2.1"
description = "Route IMAP email to work chat, generate reviewable drafts, and optionally handle allowlisted personal bot commands."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mail-to-workchat contributors" }]
keywords = ["imap", "dingtalk", "feishu", "webhook", "email"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
]
dependencies = []

[project.optional-dependencies]
dingtalk = ["dingtalk-stream>=0.24.3,<0.25"]

[project.scripts]
mail-to-workchat = "mail_to_workchat.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
